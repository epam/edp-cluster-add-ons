dependency-track:
  fullnameOverride: deptrack
  nameOverride: deptrack

  # Credentials come from the secret that the Crunchy PostgresCluster `deptrack` creates (PGO).
  database:
    jdbcUrl: "jdbc:postgresql://deptrack-primary.dependency-track.svc:5432/deptrack?reWriteBatchedInserts=true"
    existingSecret:
      name: deptrack-pguser-deptrack
      usernameKey: user
      passwordKey: password

  fileStorage:
    provider: local
    local:
      size: 20Gi

  # Secrets stored by Dependency-Track are encrypted in PostgreSQL with this key.
  # Create the secret `dependency-track-kek` before the first sync, see the README of this add-on.
  secretManagement:
    provider: database
    database:
      kek:
        mode: config
        existingSecret:
          name: dependency-track-kek
          key: kek

  frontend:
    replicaCount: 1
    apiBaseUrl: "https://deptrack.example.com"
    extraEnv:
      - name: OIDC_ISSUER
        value: "https://keycloak.example.com/auth/realms/shared"
      - name: OIDC_CLIENT_ID
        value: "deptrack"
      - name: OIDC_SCOPE
        value: "openid profile email"
      - name: OIDC_LOGIN_BUTTON_TEXT
        value: "Login with Keycloak"
      - name: OIDC_FLOW
        value: "code"
    resources:
      requests:
        cpu: 150m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi

  apiServer:
    topology: monolith
    extraEnv:
      - name: DT_OIDC_ENABLED
        value: "true"
      - name: DT_OIDC_CLIENT_ID
        value: "deptrack"
      - name: DT_OIDC_ISSUER
        value: "https://keycloak.example.com/auth/realms/shared"
      - name: DT_OIDC_USERNAME_CLAIM
        value: "preferred_username"
      - name: DT_OIDC_USER_PROVISIONING
        value: "true"
      - name: DT_OIDC_TEAMS_CLAIM
        value: "roles"
      - name: DT_OIDC_TEAM_SYNCHRONIZATION
        value: "true"
    web:
      replicaCount: 1
      # https://docs.dependencytrack.org/getting-started/deploy-docker/
      resources:
        requests:
          cpu: "1"
          memory: 768Mi
        limits:
          cpu: "2"
          memory: 4608Mi

  ingress:
    enabled: true
    tls: []
    annotations:
      kubernetes.io/ingress.class: nginx
      # allow large bom.xml uploads:
      nginx.ingress.kubernetes.io/proxy-body-size: 10m
    hostname: deptrack.example.com

# Configuration for setting up resources in Keycloak to enable OIDC authentication.
# Prerequisite: Ensure that the Keycloak Operator is installed and integrated with Keycloak.
# Refer to the installation guide for the Keycloak Operator:
# https://github.com/epam/edp-cluster-add-ons/tree/main/clusters/core/addons/keycloak-operator
#
# Additionally, necessary Keycloak resources such as realms, roles, and groups must be created
# to support component functionality. This can be done using the provided add-ons or manually:
# https://github.com/epam/edp-cluster-add-ons/tree/main/clusters/core/addons/kuberocketci-rbac
oidc:
  enabled: false
