kedaTenants:
  # -- This value specifies the namespaces where KubeRocketCI deployed.
  namespaces:
    - krci

# -- Lookback window for activity metrics, in seconds.
timeInterval: "3600"
# -- Minimum number of replicas for the scaled workload.
minReplicaCount: 0
# -- Maximum number of replicas for the scaled workload.
maxReplicaCount: 1
# -- Number of newly created pods within the lookback window required to trigger scaling.
thresholdPods: 1
# -- Number of matching HTTP requests within the lookback window required to trigger scaling.
thresholdRequests: 1
# -- Interval in seconds for KEDA to poll the triggers: Prometheus, or the krci-env-daemon scaler.
pollingInterval: 30
# -- Idle period in seconds before KEDA scales the workload down to the minimum replica count.
cooldownPeriod: 300

# -- This parameter specifies which Git servers are installed in KubeRocketCI.
# -- https://github.com/epam/edp-install/blob/master/deploy-templates/values.yaml#L2
gitProviders:
  - github
  # - gitlab
  # - bitbucket
  # - gerrit

# -- What wakes the tenant workloads. `prometheus`: the triggers above, on recently created pods and on
# NGINX Ingress requests. `krci-env-daemon`: the external-push scaler of the krci-env-daemon add-on, which
# wakes an environment on its first request through Envoy Gateway; every namespace in
# `kedaTenants.namespaces` then needs an entry in that add-on's `environments`.
trigger: prometheus

krciEnvDaemon:
  # -- Address of the krci-env-daemon scaler: Service krci-env-daemon in the namespace krci-env-daemon,
  # port 9090.
  scalerAddress: krci-env-daemon.krci-env-daemon.svc:9090
  # -- Deployments KEDA scales in every tenant namespace when `trigger` is `krci-env-daemon`. The event
  # listener `el-edp-<provider>` of each of `gitProviders` is added and starts after `tekton-interceptor`
  # is Ready.
  workloads:
    - cd-pipeline-operator
    - codebase-operator
    - krci-portal
    - tekton-interceptor
