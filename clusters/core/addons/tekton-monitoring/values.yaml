# Observability for the Tekton stack installed by the `tekton` add-on.
#
# Two halves:
#   1. serviceMonitor.* — ServiceMonitors pointing kube-prometheus-stack at the native
#      metrics endpoints that Tekton Pipelines, Triggers, Results and every EventListener
#      already expose. Nothing needs enabling on the Tekton side: the shipped
#      `config-observability` ConfigMap already sets metrics.backend-destination=prometheus
#      with taskrun.level=task / pipelinerun.level=pipeline and histogram durations.
#   2. dashboards.* — the KRCI Tekton analytics dashboards, shipped as ConfigMaps and picked
#      up by the kube-prometheus-stack Grafana sidecar (searchNamespace: ALL).
#
# The dashboard JSON in files/ is generated by ./generate.py — edit the generator, rerun it,
# and commit both. Do not hand-edit the JSON.

serviceMonitor:
  # -- Create ServiceMonitors for the Tekton components (requires prometheus-operator)
  enabled: true
  # -- Scrape interval applied to every endpoint
  interval: 30s
  # -- Labels that let Prometheus select these monitors. kube-prometheus-stack defaults
  # `serviceMonitorSelectorNilUsesHelmValues: true`, which restricts Prometheus to
  # ServiceMonitors carrying its own release label — without a match it silently ignores
  # them and every panel stays empty. Set this to the kube-prometheus-stack release name,
  # or clear it if that cluster sets `serviceMonitorSelectorNilUsesHelmValues: false`.
  additionalLabels:
    release: kube-prometheus
  # -- Namespace holding the Tekton control plane Services
  namespace: tekton-pipelines
  # -- Scrape the Pipelines controller (pipelinerun/taskrun duration, running counts, throttling, reconciler + workqueue metrics)
  pipelinesController: true
  # -- Scrape the Pipelines events controller (CloudEvents emission)
  eventsController: true
  # -- Scrape the Triggers controller (reconciler metrics for EventListener/Trigger resources)
  triggersController: true
  # -- Scrape the Tekton Results API (gRPC server metrics)
  resultsApi: true
  # -- Scrape the Tekton Results watcher (PipelineRun/TaskRun archival and deletion counters)
  resultsWatcher: true
  eventListeners:
    # -- Scrape every EventListener sink (request rate, latency, triggered resources). One
    # monitor covers all of them: the EventListener controller labels each `el-*` Service with
    # `app.kubernetes.io/managed-by: EventListener`.
    enabled: true
    # -- Discover EventListeners in every namespace. KRCI EventListeners live in the per-tenant
    # delivery namespaces, not in tekton-pipelines, so this must stay cluster-wide.
    allNamespaces: true

dashboards:
  # -- Ship the Tekton analytics Grafana dashboards as ConfigMaps
  enabled: true
  # -- Grafana sidecar discovery label (kube-prometheus-stack default: grafana_dashboard=1)
  label: grafana_dashboard
  # -- Value of the discovery label
  labelValue: "1"
  # -- Grafana folder the dashboards are filed under (sidecar folderAnnotation)
  folder: KRCI
  # -- Dashboards to install. Each entry maps to files/<name>.json.
  list:
    - tekton-pipeline-overview
    - tekton-task-analytics
    - tekton-queue-scheduling
    - tekton-eventlistener-traffic
    - tekton-platform-health
    - tekton-resource-consumption
