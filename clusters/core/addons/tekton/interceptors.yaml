apiVersion: v1
kind: ConfigMap
metadata:
  name: config-triggers-core-interceptors
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-triggers
data:
  # Comma-separated list of allowed GitHub Enterprise hostnames.
  # When the feature flag interceptors.github.use-enterprise-host-allowlist is
  # enabled in feature-flags-triggers, requests with an X-GitHub-Enterprise-Host
  # header not matching an entry here are rejected.
  github.enterprise-host-allowlist: ""

