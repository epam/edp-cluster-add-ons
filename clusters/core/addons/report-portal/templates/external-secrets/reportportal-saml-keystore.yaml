{{- if and .Values.eso.enabled .Values.saml.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-saml-keystore
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}
  data:
    # JKS keystore with the SAML SP signing key (alias report-portal-sp), stored Base64-encoded.
    - secretKey: keystore.jks
      remoteRef:
        key: {{ .Values.eso.secretPath }}
        property: reportportal.samlKeystore
        decodingStrategy: Base64
    - secretKey: keystore-password
      remoteRef:
        key: {{ .Values.eso.secretPath }}
        property: reportportal.samlKeystorePassword
    - secretKey: key-password
      remoteRef:
        key: {{ .Values.eso.secretPath }}
        property: reportportal.samlKeyPassword
{{- end }}
