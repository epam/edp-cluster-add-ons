{{- if .Values.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ index .Values "krci-security-operator" "defectdojo" "secretName" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}
  data:
  - secretKey: url
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ .Values.eso.secretPath }}
      metadataPolicy: None
      property: defectdojo.url
  - secretKey: token
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: {{ .Values.eso.secretPath }}
      metadataPolicy: None
      property: defectdojo.token
{{- end }}
