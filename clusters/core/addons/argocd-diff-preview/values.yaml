vcluster:
  # The gitops review pipeline reads this secret to connect; keep the release
  # name and namespace aligned with the server URL and SAN below.
  exportKubeConfig:
    server: https://argocd-diff-preview.argocd-diff-preview.svc:443

  controlPlane:
    proxy:
      extraSANs:
        - argocd-diff-preview.argocd-diff-preview.svc

  # Namespace-scoped RBAC only: the preview environment needs no nodes,
  # storage classes or CSI objects from the host.
  rbac:
    clusterRole:
      enabled: false

  sync:
    fromHost:
      storageClasses:
        enabled: false
      csiNodes:
        enabled: false
      csiDrivers:
        enabled: false
      csiStorageCapacities:
        enabled: false
      # Project this addon's repo credential into the virtual cluster so the
      # embedded Argo CD clones the repositories itself - nothing is copied at
      # runtime and rotation propagates automatically.
      #
      # The host side is this addon's own namespace, where the vcluster syncer
      # already has secret access via the chart's default Role, so the
      # projection needs no additional RBAC. Keep it that way: mapping another
      # namespace grants read on every secret in it, since 'list'/'watch'
      # cannot be restricted by resourceName.
      secrets:
        enabled: true
        mappings:
          byName:
            # host-namespace/name: vcluster-namespace/name
            "argocd-diff-preview/argocd-preview-vcs": "argocd/argocd-preview-vcs"
            #
            # Argo CD matches credentials per source repoURL: 'repository'
            # secrets by exact URL, 'repo-creds' secrets by URL prefix. The
            # preview must clone BOTH the GitOps repository (the $values
            # source) and each codebase repository (the deploy-templates chart
            # source), so the credential must be a repo-creds PREFIX secret
            # covering the git server - a per-repository secret renders an
            # empty diff. One prefix covers a whole git server, so mappings
            # scale with git servers, not repositories.
            #
            # Add one mapping per extra credential the preview needs, each
            # materialized into THIS namespace (see templates/external-secrets):
            # "argocd-diff-preview/oci-registry-creds": "argocd/oci-registry-creds"

  experimental:
    deploy:
      vcluster:
        # Optional raw manifests applied inside the virtual cluster at boot.
        # Used on environments whose git host is not resolvable from pods
        # (e.g. the try-kuberocketci testbed's 127.0.0.1.nip.io domain needs a
        # CoreDNS forward to the host cluster DNS). Empty by default:
        # production git hosts must simply be resolvable from cluster
        # workloads.
        #
        # Example - forward a loopback nip.io git host to the host cluster DNS
        # (10.96.0.10 = host kube-dns ClusterIP):
        # manifests: |
        #   apiVersion: v1
        #   kind: ConfigMap
        #   metadata:
        #     name: coredns-custom
        #     namespace: kube-system
        #   data:
        #     gitlab.server: |
        #       gitlab.127.0.0.1.nip.io:1053 {
        #           forward . 10.96.0.10
        #       }
        manifests: ""
        helm:
          - chart:
              name: argo-cd
              repo: https://argoproj.github.io/argo-helm
              version: 9.5.17
            release:
              name: argocd
              namespace: argocd
            # Minimal Argo CD: it only renders manifests, it never syncs.
            # configs.ssh.extraHosts must carry the git server host keys when
            # the server is not covered by the chart's default known_hosts
            # (one entry per self-hosted SSH git server; obtain via
            # 'ssh-keyscan -p <port> <host>'). Example:
            #
            # configs:
            #   ssh:
            #     extraHosts: |
            #       [gitlab.example.com]:32222 ssh-ed25519 AAAA...
            #       [gitlab.example.com]:32222 ssh-rsa AAAA...
            values: |-
              dex:
                enabled: false
              notifications:
                enabled: false
              configs:
                params:
                  server.insecure: true

# Repository credential for the embedded Argo CD, materialized into this
# addon's own namespace.
#
# Use an account of its own rather than the platform's Argo CD credential, so
# the preview environment stays independent of platform credential changes.
# Read access is all it needs - on GitLab, Reporter on the group covers every
# current and future project in one step.
#
# Expected properties at <secretPath>:
#   argocd-preview-vcs.sshPrivateKey  base64-encoded private key
#   argocd-preview-vcs.url            repo-creds URL prefix, built from the
#                                     GitServer spec as
#                                     ssh://<gitUser>@<gitHost>:<sshPort>/
#
# Without ESO, create the secret by hand in this addon's namespace with the
# same name, keys and the argocd.argoproj.io/secret-type: repo-creds label.
eso:
  # -- Install components of the ESO.
  enabled: false
  # -- Defines provider type. One of `aws`, `generic`, or `vault`.
  provider: "aws"
  # -- Defines the path to the secret in the provider. If provider is `vault`, this path must be prefixed with `secret/`.
  secretPath: "/infra/core/addons/argocd-diff-preview"
  # -- Vault configuration (if provider is `vault`).
  vault:
    # -- Vault server URL.
    server: "http://vault.vault:8200"
    # -- Mount path for the Kubernetes authentication method.
    mountPath: "core"
    # -- Vault role for the Kubernetes authentication method.
    role: argocd
  # -- AWS configuration (if provider is `aws`).
  aws:
    # -- AWS region.
    region: "eu-central-1"
    # -- AWS role ARN for the ExternalSecretOperator to assume.
    roleArn: "arn:aws:iam::012345678910:role/AWSIRSA_Shared_ExternalSecretOperatorAccess"
  generic:
    secretStore:
      # -- Defines SecretStore provider configuration.
      providerConfig: {}
      #  gcpsm:
      #    projectID: "alphabet-123"
