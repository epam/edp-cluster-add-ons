{{- /*
Read-only repository credential for the embedded Argo CD, materialized into
this addon's own namespace and projected into the virtual cluster by the
vcluster syncer (see vcluster.sync.fromHost.secrets in values.yaml).

The repo-creds label must be present for the embedded Argo CD to recognise the
secret as a credential template; vcluster's fromHost syncer copies labels
verbatim, so the label survives the projection.
*/ -}}
{{- if .Values.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-preview-vcs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}
  data:
  - secretKey: sshPrivateKey
    remoteRef:
      key: {{ .Values.eso.secretPath }}
      metadataPolicy: None
      property: argocd-preview-vcs.sshPrivateKey
      decodingStrategy: Base64
  - secretKey: url
    remoteRef:
      key: {{ .Values.eso.secretPath }}
      metadataPolicy: None
      property: argocd-preview-vcs.url
  target:
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
{{- end }}
