{{- if and (index .Values "krci-env-daemon") (index .Values "krci-env-daemon" "enable") -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.destinationServer}}-krci-env-daemon
  namespace: {{ .Values.argoNamespace | default "argocd" }}
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argoProject | default "default" }}
  source:
    repoURL: {{ .Values.repoUrl }}
    path: clusters/{{ .Values.clusterName }}/addons/krci-env-daemon
    targetRevision: {{ .Values.targetRevision }}
    helm:
      releaseName: krci-env-daemon
  destination:
    name: {{ .Values.destinationServer | default "in-cluster" }}
    namespace: {{ index .Values "krci-env-daemon" "namespace" }}
  syncPolicy:
    syncOptions:
      - CreateNamespace={{ (index .Values "krci-env-daemon" "createNamespace") }}
    retry:
      limit: 1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
{{- end -}}
